<mat-card class="fullscreen-card">
  @if (dayData(); as data) {
    <mat-card-header class="card-header">
      <mat-card-title class="card-title">Сегодня: {{ data.date.dayNum }}</mat-card-title>
    </mat-card-header>

    <mat-card-content class="card-content">
      <div class="progress-container">
        <div class="progress-info">
          <span class="progress-label">Прогресс задач</span>
          <strong class="progress-values"
            >{{ dayStore.completedTasks() }} / {{ dayStore.totalTasks() }}</strong
          >
        </div>
        <mat-progress-bar
          mode="determinate"
          [value]="dayStore.progress()"
          color="primary"
          class="task-progress-bar"
        ></mat-progress-bar>
      </div>

      <mat-button-toggle-group name="todoFilters" value="all" class="filter-group">
        <app-task-filter [(filter)]="currentFilter" />
      </mat-button-toggle-group>

      <div class="task-list">
        @for (task of data.tasks; track task.id) {
          <div class="task-item">
            <mat-checkbox [checked]="task.completed" class="task-checkbox">
              <span class="task-text" [class.completed]="task.completed">
                {{ task.title }}
              </span>
            </mat-checkbox>
          </div>
        } @empty {
          <div class="empty-state">Список задач пуст</div>
        }
      </div>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <button mat-raised-button color="primary" class="action-btn">
        <mat-icon>add</mat-icon>
        Добавить задачу
      </button>
      <button mat-stroked-button color="accent" class="action-btn">
        <mat-icon>assessment</mat-icon>
        Сформировать отчёт
      </button>
    </mat-card-actions>
  }
</mat-card>
