<mat-card class="fullscreen-card">
  @if (dayData(); as data) {
    <app-day-header-component [metadata]="data.metadata" />
    <mat-card-content class="card-content">
      <mat-tab-group class="form-tabs">
        <!-- ВКЛАДКА 1: ОБЩЕЕ (БРИФИНГ И ПРИМЕЧАНИЯ) -->
        <app-day-briefing-component [(briefingData)]="data.briefing"> </app-day-briefing-component>

        <!-- ВКЛАДКА 2: ТЕОРИЯ (ИНФОРМАЦИЯ И ПОЛЯ ОТВЕТОВ) -->
        <app-day-theory-component [(theoryData)]="data.theory"></app-day-theory-component>

        <!-- ВКЛАДКА 3: ПРАКТИКА И ЗАДАЧИ -->
        <app-day-practice-component
          [(practiceData)]="data.practice"
          [taskActions]="dayStore.taskActions"
          [taskStatistics]="dayStore.taskStatistics()"
        ></app-day-practice-component>

        <!-- ВКЛАДКА 4: ВОПРОСЫ, АРХИТЕКТУРА И САМООЦЕНКА -->
        <app-day-questions-component
          [(questionsData)]="dayData()!.questions"
          (questionAnswerChange)="onQuestionAnswerChange($event.questionId, $event.updatedFields)"
        />
      </mat-tab-group>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <button
        mat-raised-button
        color="primary"
        class="action-btn"
        [disabled]="!data.metadata.done"
        (click)="generateReport()"
      >
        <mat-icon>assessment</mat-icon> {{ 'dayPage.btnReport' | translate }}
      </button>
    </mat-card-actions>
  } @else {
    <mat-card-content class="card-content-empty">
      <div class="empty-day-state">
        <mat-icon class="calendar-empty-icon">calendar_today</mat-icon>
        <p class="empty-title">{{ 'dayPage.dayNotSelected' | translate }}</p>
        <p class="empty-subtitle">{{ 'dayPage.uploadInstructions' | translate }}</p>

        <mat-form-field appearance="outline" class="json-upload-field">
          <mat-label>{{ 'dayPage.jsonLabel' | translate }}</mat-label>
          <textarea
            matInput
            [ngModel]="jsonInput()"
            (ngModelChange)="jsonInput.set($event)"
            rows="8"
            [placeholder]="'dayPage.jsonPlaceholder' | translate"
          >
          </textarea>
        </mat-form-field>
        @if (this.errorMessage()) {
          <mat-form-field appearance="outline" class="json-error-field">
            <mat-label>{{ 'dayPage.jsonValidationError' | translate }}</mat-label>
            <textarea matInput readonly [value]="errorMessage()" rows="6"> </textarea>
          </mat-form-field>
        }
        <!-- Кнопка подтверждения и загрузки дня в Store -->
        <button mat-raised-button color="primary" class="load-day-btn" (click)="loadDayFromJson()">
          <mat-icon>cloud_upload</mat-icon>
          {{ 'dayPage.btnLoad' | translate }}
        </button>
      </div>
    </mat-card-content>
  }
</mat-card>
